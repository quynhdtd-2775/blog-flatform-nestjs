<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; }
    section { margin-bottom: 28px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #f4f4f4; }
    input { padding: 4px; margin: 2px; }
    button { padding: 4px 10px; }
    .msg { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <h2>User Dashboard</h2>

    <section>
      <h3>Books</h3>
      <table>
        <thead>
          <tr><th>Title</th><th>Available</th><th>Comment</th><th>Borrow</th></tr>
        </thead>
        <tbody id="booksBody"></tbody>
      </table>
      <p id="bookMsg" class="msg"></p>
    </section>

    <section>
      <h3>My Borrow History</h3>
      <button onclick="loadHistory()">Refresh</button>
      <table>
        <thead>
          <tr><th>ID</th><th>From</th><th>To</th><th>Status</th><th>Books</th><th>Action</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <p id="historyMsg" class="msg"></p>
    </section>
  </div>

  <script src="common.js"></script>
  <script>
    const currentUser = requireRole('USER', 'ADMIN');
    if (currentUser) {
      renderNav('user');
      loadBooks();
      loadHistory();
    }

    async function loadBooks() {
      const { data } = await apiFetch('/books');
      document.getElementById('booksBody').innerHTML = (data.data || [])
        .map(
          (book) => `<tr>
            <td>${book.title}</td>
            <td>${book.availableQuantity}/${book.totalQuantity}</td>
            <td>
              <input id="comment-${book.id}" placeholder="Say something..." />
              <button onclick="addComment(${book.id})">Post</button>
            </td>
            <td>
              <input id="from-${book.id}" type="date" />
              <input id="to-${book.id}" type="date" />
              <input id="qty-${book.id}" type="number" value="1" min="1" style="width:50px" />
              <button onclick="borrowBook(${book.id})">Borrow</button>
            </td>
          </tr>`,
        )
        .join('');
    }

    async function addComment(bookId) {
      const content = document.getElementById(`comment-${bookId}`).value;
      const { ok, data } = await apiFetch(`/books/${bookId}/comments`, {
        method: 'POST',
        body: JSON.stringify({ content }),
      });
      document.getElementById('bookMsg').textContent = ok
        ? 'Comment posted.'
        : (data && data.message) || 'Failed to post comment.';
    }

    async function borrowBook(bookId) {
      const fromDate = document.getElementById(`from-${bookId}`).value;
      const toDate = document.getElementById(`to-${bookId}`).value;
      const quantity = Number(document.getElementById(`qty-${bookId}`).value);

      const { ok, data } = await apiFetch('/borrow-requests', {
        method: 'POST',
        body: JSON.stringify({
          fromDate,
          toDate,
          books: [{ bookId, quantity }],
        }),
      });

      document.getElementById('bookMsg').textContent = ok
        ? `Borrow request #${data.id} created (${data.status}).`
        : (data && data.message) || 'Failed to create borrow request.';

      if (ok) loadHistory();
    }

    async function loadHistory() {
      const { data } = await apiFetch('/borrow-requests/history');
      document.getElementById('historyBody').innerHTML = (data.data || [])
        .map((request) => {
          const cancellable = ['NEW', 'PENDING'].includes(request.status);
          const booksLabel = request.books
            .map((book) => `${book.title} x${book.quantity}`)
            .join(', ');
          return `<tr>
            <td>${request.id}</td>
            <td>${request.fromDate}</td>
            <td>${request.toDate}</td>
            <td>${request.status}</td>
            <td>${booksLabel}</td>
            <td>${
              cancellable
                ? `<button onclick="cancelRequest(${request.id})">Cancel</button>`
                : ''
            }</td>
          </tr>`;
        })
        .join('');
    }

    async function cancelRequest(id) {
      const { ok, data } = await apiFetch(`/borrow-requests/${id}/cancel`, {
        method: 'PUT',
      });
      document.getElementById('historyMsg').textContent = ok
        ? `Request #${id} cancelled.`
        : (data && data.message) || 'Failed to cancel request.';
      loadHistory();
    }
  </script>
</body>
</html>
