<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; }
    pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Login</h2>

  <label>Email</label>
  <input id="email" type="email" placeholder="admin@example.com" />

  <label>Password</label>
  <input id="password" type="password" placeholder="Admin@123" />

  <button onclick="login()">Login</button>

  <h3>Response</h3>
  <pre id="result">---</pre>

  <script src="common.js"></script>
  <script>
    renderNav('login');

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { ok, data } = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });

      document.getElementById('result').textContent = JSON.stringify(data, null, 2);

      if (ok && data.accessToken) {
        saveSession(data.accessToken);
        const user = getCurrentUser();
        const target = user && user.role === 'ADMIN' ? 'admin.html' : 'user.html';
        window.location.href = target;
      }
    }
  </script>
</body>
</html>
